[project]
name = "gradient-descent-viz"
version = "0.1.0"
description = "From-scratch gradient descent and Newton optimizers with convergence plots."
requires-python = ">=3.8"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.scripts]
gdviz = "gdviz.__main__:main"

[tool.setuptools.packages.find]
include = ["gdviz*"]
